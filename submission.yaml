submission:
  title: "PortMind AI — Container Congestion Predictor & Port Operations Optimiser"

  problem_statement: >
    Large ports receive hundreds of vessels daily but operate with limited berths, cranes,
    yard capacity, and labour. When vessel arrivals exceed available capacity, congestion
    cascades into vessel waiting, yard overflow, crane under-utilisation, delivery delays,
    and supply-chain disruption. Port operators currently rely on spreadsheets and fragmented
    systems, lacking a unified AI-assisted decision-support platform.

  solution_summary: >
    PortMind AI is an intelligent port operations control centre that ingests vessel,
    berth, crane, and yard data to predict congestion risk, optimise berth and crane
    allocation, monitor yard capacity by zone, and simulate the impact of disruptions
    (weather, strikes, crane failures). An AI Copilot answers plain-language operational
    queries in real time, while an Executive Report generator produces printable briefings.
    The system is decision-oriented — every recommendation includes a reason, expected
    impact, and confidence level.

  key_features:
    - "AI-assisted risk scoring (0–100) for every vessel with factor-level explanations"
    - "72-hour congestion forecast with narrative reasoning for each time window"
    - "AI Crisis Mode simulator — models disruption scenarios and generates 5-step response plans"
    - "Berth optimisation engine — compares current plan vs AI-recommended plan with per-vessel impact"
    - "PortMind Copilot — natural-language AI chat interface answering real-time operational queries"

  tech_stack:
    languages: ["HTML5", "CSS3", "JavaScript (Vanilla ES6+)", "Node.js"]
    frameworks: ["Express.js"]
    ibm_technologies: ["IBM Bob (AI assistant used throughout development)"]
    databases: ["JSON flat-file (demo)", "PostgreSQL-ready architecture"]
    other: ["REST API", "CSS Custom Properties (theme system)", "LocalStorage (state persistence)"]

  what_we_are_most_proud_of: >
    The AI Crisis Mode simulator and the PortMind Copilot together demonstrate end-to-end
    AI decision support. The simulator produces structured before/after impact analysis and
    a prioritised 5-step response plan for any disruption type. The Copilot answers 12
    categories of operational queries using live port data with structured, transparent
    responses that always include a recommendation, reason, expected impact, and a simulation
    disclaimer. The entire 29-file application was built using only HTML, CSS, and
    Vanilla JavaScript — no build tools, no frameworks — yet achieves commercial-grade
    visual quality and full interactivity.

  known_limitations: >
    All data is simulated demo data — no real port systems are connected.
    AI risk scores and recommendations are rule-based simulations, not trained ML models.
    The backend REST API (Node.js/Express) provides live data when running but the
    frontend falls back to embedded data when offline. No authentication is implemented
    (prototype only). The application has been tested on Chrome and Edge; minor layout
    differences may exist on Safari mobile.

